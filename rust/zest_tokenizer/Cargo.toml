[package]
name = "zest_tokenizer"
version = "0.2.0"
edition = "2021"
description = "Fast O(L) flat-array Rust trie tokenizer for ZEST protein motif vocabularies"
license = "MIT"

[lib]
name = "zest_tokenizer"
crate-type = ["cdylib"]

[dependencies]
pyo3 = { version = "0.23", features = ["extension-module"] }
rayon = "1.10"
serde_json = { version = "1.0", features = ["preserve_order"] }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
